<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} - StartMVC</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .dashboard-container {
            display: flex;
            min-height: 100vh;
        }
        
        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 20px 0;
        }
        
        .sidebar-header {
            padding: 0 20px 20px;
            border-bottom: 1px solid #34495e;
        }
        
        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 20px 0;
        }
        
        .sidebar-menu li {
            margin: 0;
        }
        
        .sidebar-menu a {
            display: block;
            padding: 10px 20px;
            color: #ecf0f1;
            text-decoration: none;
            transition: background-color 0.3s;
        }
        
        .sidebar-menu a:hover, .sidebar-menu a.active {
            background-color: #34495e;
        }
        
        .main-content {
            flex: 1;
            padding: 20px;
            background-color: #f8f9fa;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #ddd;
            margin-bottom: 20px;
        }
        
        .user-info {
            display: flex;
            align-items: center;
        }
        
        .user-info img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 10px;
        }
        
        .profile-container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }
        
        .profile-sidebar {
            background-color: #fff;
            border-radius: 5px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .profile-avatar {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .profile-avatar img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #f8f9fa;
        }
        
        .profile-info {
            margin-bottom: 20px;
        }
        
        .profile-info h3 {
            margin-top: 0;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        
        .profile-info p {
            margin: 5px 0;
        }
        
        .profile-main {
            background-color: #fff;
            border-radius: 5px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .profile-tabs {
            display: flex;
            border-bottom: 1px solid #ddd;
            margin-bottom: 20px;
        }
        
        .profile-tabs button {
            background: none;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 1em;
            color: #7f8c8d;
            border-bottom: 2px solid transparent;
        }
        
        .profile-tabs button.active {
            color: #3498db;
            border-bottom-color: #3498db;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 3px;
        }
        
        .form-actions {
            margin-top: 20px;
        }
        
        .btn {
            display: inline-block;
            padding: 10px 15px;
            background-color: #3498db;
            color: #fff;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        
        .btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>StartMVC</h2>
                <p>管理控制台</p>
            </div>
            
            <ul class="sidebar-menu">
                <li><a href="/admin">控制面板</a></li>
                <li><a href="/admin/index/dashboard">仪表盘</a></li>
                <li><a href="/admin/user">用户管理</a></li>
                <li><a href="/admin/content">内容管理</a></li>
                <li><a href="/admin/setting">系统设置</a></li>
                <li><a href="/admin/index/profile" class="active">个人资料</a></li>
                <li><a href="/login/logout">退出登录</a></li>
            </ul>
        </div>
        
        <div class="main-content">
            <div class="header">
                <h1>{{title}}</h1>
                
                <div class="user-info">
                    <img src="https://via.placeholder.com/40" alt="用户头像">
                    <span>{{username}}</span>
                </div>
            </div>
            
            <div class="profile-container">
                <div class="profile-sidebar">
                    <div class="profile-avatar">
                        <img src="https://via.placeholder.com/150" alt="用户头像">
                        <h2>{{username}}</h2>
                        <p>管理员</p>
                    </div>
                    
                    <div class="profile-info">
                        <h3>基本信息</h3>
                        <p><strong>用户ID:</strong> {{user_id}}</p>
                        <p><strong>注册时间:</strong> 2025-01-01</p>
                        <p><strong>最后登录:</strong> 2025-05-25</p>
                        <p><strong>状态:</strong> <span style="color: green;">在线</span></p>
                    </div>
                    
                    <div class="profile-info">
                        <h3>联系方式</h3>
                        <p><strong>邮箱:</strong> admin@example.com</p>
                        <p><strong>电话:</strong> 13800138000</p>
                    </div>
                </div>
                
                <div class="profile-main">
                    <div class="profile-tabs">
                        <button class="tab-btn active" data-tab="profile">个人资料</button>
                        <button class="tab-btn" data-tab="security">安全设置</button>
                        <button class="tab-btn" data-tab="notification">通知设置</button>
                    </div>
                    
                    <div id="profile" class="tab-content active">
                        <h2>编辑个人资料</h2>
                        <form id="profile-form">
                            <div class="form-group">
                                <label for="username">用户名</label>
                                <input type="text" id="username" name="username" value="{{username}}">
                            </div>
                            
                            <div class="form-group">
                                <label for="email">邮箱</label>
                                <input type="email" id="email" name="email" value="admin@example.com">
                            </div>
                            
                            <div class="form-group">
                                <label for="phone">电话</label>
                                <input type="tel" id="phone" name="phone" value="13800138000">
                            </div>
                            
                            <div class="form-group">
                                <label for="bio">个人简介</label>
                                <textarea id="bio" name="bio" rows="5">这是一个管理员账号，负责系统的日常维护和管理。</textarea>
                            </div>
                            
                            <div class="form-actions">
                                <button type="submit" class="btn">保存更改</button>
                            </div>
                        </form>
                    </div>
                    
                    <div id="security" class="tab-content">
                        <h2>安全设置</h2>
                        <form id="security-form">
                            <div class="form-group">
                                <label for="current-password">当前密码</label>
                                <input type="password" id="current-password" name="current_password">
                            </div>
                            
                            <div class="form-group">
                                <label for="new-password">新密码</label>
                                <input type="password" id="new-password" name="new_password">
                            </div>
                            
                            <div class="form-group">
                                <label for="confirm-password">确认新密码</label>
                                <input type="password" id="confirm-password" name="confirm_password">
                            </div>
                            
                            <div class="form-actions">
                                <button type="submit" class="btn">更改密码</button>
                            </div>
                        </form>
                    </div>
                    
                    <div id="notification" class="tab-content">
                        <h2>通知设置</h2>
                        <form id="notification-form">
                            <div class="form-group">
                                <label>
                                    <input type="checkbox" name="email_notification" checked> 接收邮件通知
                                </label>
                            </div>
                            
                            <div class="form-group">
                                <label>
                                    <input type="checkbox" name="sms_notification"> 接收短信通知
                                </label>
                            </div>
                            
                            <div class="form-group">
                                <label>
                                    <input type="checkbox" name="system_notification" checked> 接收系统通知
                                </label>
                            </div>
                            
                            <div class="form-actions">
                                <button type="submit" class="btn">保存设置</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/static/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 标签页切换
            const tabButtons = document.querySelectorAll('.tab-btn');
            const tabContents = document.querySelectorAll('.tab-content');
            
            tabButtons.forEach(button => {
                button.addEventListener('click', function() {
                    // 移除所有活动状态
                    tabButtons.forEach(btn => btn.classList.remove('active'));
                    tabContents.forEach(content => content.classList.remove('active'));
                    
                    // 添加当前活动状态
                    this.classList.add('active');
                    const tabId = this.getAttribute('data-tab');
                    document.getElementById(tabId).classList.add('active');
                });
            });
            
            // 表单提交
            const profileForm = document.getElementById('profile-form');
            profileForm.addEventListener('submit', function(e) {
                e.preventDefault();
                alert('个人资料已更新');
            });
            
            const securityForm = document.getElementById('security-form');
            securityForm.addEventListener('submit', function(e) {
                e.preventDefault();
                alert('密码已更改');
            });
            
            const notificationForm = document.getElementById('notification-form');
            notificationForm.addEventListener('submit', function(e) {
                e.preventDefault();
                alert('通知设置已保存');
            });
        });
    </script>
</body>
</html>
