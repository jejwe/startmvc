<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1>{{ title }}</h1>
        
        <div class="mb-4">
            <a href="/home/event/index" class="btn btn-secondary">返回</a>
        </div>
        
        <div class="card mb-4">
            <div class="card-header">
                操作结果
            </div>
            <div class="card-body">
                <p><strong>事件名称:</strong> {{ event_name }}</p>
                
                {% if success %}
                <div class="alert alert-success">
                    成功移除事件监听器
                </div>
                {% else %}
                <div class="alert alert-danger">
                    移除事件监听器失败，可能是事件不存在
                </div>
                {% endif %}
                
                <p><strong>当前是否有监听器:</strong> {{ 'Yes' if has_listeners else 'No' }}</p>
            </div>
        </div>
        
        <div class="mt-4">
            <a href="/home/event/index" class="btn btn-primary">返回事件列表</a>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
