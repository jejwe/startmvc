<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1>{{ title }}</h1>
        
        <div class="mb-4">
            <a href="/home/database/query" class="btn btn-primary me-2">查询示例</a>
            <a href="/home/database/find" class="btn btn-primary me-2">查询单条记录示例</a>
            <a href="/home/database/insert" class="btn btn-success me-2">插入示例</a>
            <a href="/home/database/update" class="btn btn-warning me-2">更新示例</a>
            <a href="/home/database/delete" class="btn btn-danger me-2">删除示例</a>
            <a href="/home/database/transaction" class="btn btn-info me-2">事务示例</a>
        </div>
        
        <h2>数据列表</h2>
        
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>姓名</th>
                    <th>年龄</th>
                    <th>邮箱</th>
                    <th>创建时间</th>
                    <th>更新时间</th>
                </tr>
            </thead>
            <tbody>
                {% for item in data %}
                <tr>
                    <td>{{ item.id }}</td>
                    <td>{{ item.name }}</td>
                    <td>{{ item.age }}</td>
                    <td>{{ item.email }}</td>
                    <td>{{ item.created_at }}</td>
                    <td>{{ item.updated_at }}</td>
                </tr>
                {% endfor %}
                
                {% if not data %}
                <tr>
                    <td colspan="6" class="text-center">暂无数据</td>
                </tr>
                {% endif %}
            </tbody>
        </table>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
