<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1>{{ title }}</h1>
        
        <div class="mb-4">
            <a href="/home/database/index" class="btn btn-secondary">返回</a>
        </div>
        
        <div class="card mb-4">
            <div class="card-header">
                SQL语句
            </div>
            <div class="card-body">
                <pre>{{ sql }}</pre>
            </div>
        </div>
        
        <h2>查询结果</h2>
        
        {% if data %}
        <div class="card">
            <div class="card-body">
                <dl class="row">
                    <dt class="col-sm-3">ID</dt>
                    <dd class="col-sm-9">{{ data.id }}</dd>
                    
                    <dt class="col-sm-3">姓名</dt>
                    <dd class="col-sm-9">{{ data.name }}</dd>
                    
                    <dt class="col-sm-3">年龄</dt>
                    <dd class="col-sm-9">{{ data.age }}</dd>
                    
                    <dt class="col-sm-3">邮箱</dt>
                    <dd class="col-sm-9">{{ data.email }}</dd>
                    
                    <dt class="col-sm-3">创建时间</dt>
                    <dd class="col-sm-9">{{ data.created_at }}</dd>
                    
                    <dt class="col-sm-3">更新时间</dt>
                    <dd class="col-sm-9">{{ data.updated_at }}</dd>
                </dl>
            </div>
        </div>
        {% else %}
        <div class="alert alert-warning">
            未找到记录
        </div>
        {% endif %}
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
