<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1>{{ title }}</h1>
        
        <div class="mb-4">
            <a href="/home/database/index" class="btn btn-secondary">返回</a>
        </div>
        
        <div class="card mb-4">
            <div class="card-header">
                SQL语句
            </div>
            <div class="card-body">
                <pre>{{ sql }}</pre>
            </div>
        </div>
        
        <h2>查询结果</h2>
        
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>姓名</th>
                    <th>年龄</th>
                    <th>邮箱</th>
                </tr>
            </thead>
            <tbody>
                {% for item in data %}
                <tr>
                    <td>{{ item.id }}</td>
                    <td>{{ item.name }}</td>
                    <td>{{ item.age }}</td>
                    <td>{{ item.email }}</td>
                </tr>
                {% endfor %}
                
                {% if not data %}
                <tr>
                    <td colspan="4" class="text-center">暂无数据</td>
                </tr>
                {% endif %}
            </tbody>
        </table>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
