<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StartMVC - Error</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            color: #333;
            background-color: #f8f8f8;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            color: #e74c3c;
            border-bottom: 2px solid #e74c3c;
            padding-bottom: 10px;
        }
        .error-message {
            background-color: #fdf7f7;
            border-left: 4px solid #e74c3c;
            padding: 15px;
            margin-bottom: 20px;
        }
        .error-details {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .error-trace {
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            font-family: monospace;
            white-space: pre-wrap;
        }
        .highlight {
            color: #e74c3c;
            font-weight: bold;
        }
        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.9em;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>StartMVC Error</h1>
        
        <div class="error-message">
            <h2>Error Message</h2>
            <p>{message}</p>
        </div>
        
        <div class="error-details">
            <h2>Error Details</h2>
            <p><strong>File:</strong> {file}</p>
            <p><strong>Line:</strong> {line}</p>
        </div>
        
        <div class="error-trace">
            <h2>Stack Trace</h2>
            {trace}
        </div>
        
        <footer>
            &copy; 2025 StartMVC Python Framework - Version 2.3.7
        </footer>
    </div>
</body>
</html>
